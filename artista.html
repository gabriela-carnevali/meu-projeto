<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biografia do Artista</title>

    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./src/css/style.css" />
  </head>
  <body>
    <header class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand brand-title" href="index.html">Produção Musical</a>
        <a href="contratar.html" class="btn btn-purple fw-semibold">Contratar Produção</a>
      </div>
    </header>

    <main class="container py-5 text-white">
      <a href="index.html" class="btn btn-outline-light mb-4">
        <i class="bi bi-arrow-left"></i> Voltar aos Lançamentos
      </a>

      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <div class="card custom-card p-4 p-md-5 text-center">
            <img id="artista-foto" src="" class="img-fluid rounded-circle player-img mx-auto mb-4" alt="Foto do Artista" style="width: 200px; height: 200px; object-fit: cover;">
            <h2 id="artista-nome" class="fw-bold mb-1 text-white">--</h2>
            <p id="artista-genero" class="text-purple fw-semibold mb-3">--</p>

            <div class="border-top border-secondary pt-4 text-start">
              <h5 class="fw-bold mb-3 text-white"><i class="bi bi-person-lines-fill me-2"></i>Sobre o Artista</h5>
              <p id="artista-bio" class="text-secondary leading-relaxed">--</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center py-4 text-secondary">
      <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/script.js"></script>
  </body>
</html>
